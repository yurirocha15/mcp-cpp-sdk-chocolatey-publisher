name: publish-chocolatey

on:
  workflow_dispatch:
    inputs:
      source_tag:
        required: true
        type: string
      source_commit_sha:
        required: true
        type: string
      source_workflow_head_sha:
        required: true
        type: string
      provider_control_sha:
        required: true
        type: string
      github_release_id:
        required: true
        type: string
      source_workflow_run_id:
        required: true
        type: string
      release_manifest_sha256:
        required: true
        type: string
      request_uuid:
        required: true
        type: string

permissions:
  contents: read

env:
  DISPATCH_JSON: >-
    {"source_tag":${{ toJSON(inputs.source_tag) }},"source_commit_sha":${{ toJSON(inputs.source_commit_sha) }},"source_workflow_head_sha":${{ toJSON(inputs.source_workflow_head_sha) }},"provider_control_sha":${{ toJSON(inputs.provider_control_sha) }},"github_release_id":${{ toJSON(inputs.github_release_id) }},"source_workflow_run_id":${{ toJSON(inputs.source_workflow_run_id) }},"release_manifest_sha256":${{ toJSON(inputs.release_manifest_sha256) }},"request_uuid":${{ toJSON(inputs.request_uuid) }}}

concurrency:
  group: chocolatey-publishing
  cancel-in-progress: false

jobs:
  verify:
    name: verify signed immutable Chocolatey input
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.input.outputs.version }}
      package_name: ${{ steps.package.outputs.package_name }}
      package_sha256: ${{ steps.package.outputs.package_sha256 }}
    steps:
      - name: Checkout immutable publisher controls
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate the exact dispatch schema
        id: input
        run: python3 -I -S run_publisher_tool.py validate_dispatch
      - name: Verify execution context, source release, source run, and signed tag
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHER_REPOSITORY_ID: ${{ vars.PUBLISHER_REPOSITORY_ID }}
          SOURCE_REPOSITORY_ID: ${{ vars.SOURCE_REPOSITORY_ID }}
          SOURCE_OWNER_ID: ${{ vars.SOURCE_OWNER_ID }}
          SOURCE_SIGNING_PRIMARY_FINGERPRINT: ${{ vars.SOURCE_SIGNING_PRIMARY_FINGERPRINT }}
          SOURCE_TAG_SIGNING_SUBKEY_FINGERPRINT: ${{ vars.SOURCE_TAG_SIGNING_SUBKEY_FINGERPRINT }}
        run: >-
          python3 -I -S run_publisher_tool.py verify_source
          --public-key keys/release-signing-key.asc
      - name: Download and independently verify the release package
        id: package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.input.outputs.source_tag }}
          COMMIT: ${{ steps.input.outputs.source_commit_sha }}
          MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
          PRIMARY_FINGERPRINT: ${{ vars.SOURCE_SIGNING_PRIMARY_FINGERPRINT }}
          ARTIFACT_FINGERPRINT: ${{ vars.SOURCE_ARTIFACT_SIGNING_SUBKEY_FINGERPRINT }}
          PUBLISHER_REPOSITORY_ID: ${{ vars.PUBLISHER_REPOSITORY_ID }}
          PROVIDER_CONTROL_SHA: ${{ inputs.provider_control_sha }}
        run: |
          mkdir release-assets
          gh release download "${TAG}" --repo yurirocha15/mcp-cpp-sdk --dir release-assets
          python3 -I -S run_publisher_tool.py verify_release \
            --directory release-assets --tag "${TAG}" --commit "${COMMIT}" \
            --manifest-sha256 "${MANIFEST_SHA256}" \
            --primary-fingerprint "${PRIMARY_FINGERPRINT}" \
            --artifact-fingerprint "${ARTIFACT_FINGERPRINT}" \
            --public-key keys/release-signing-key.asc \
            --publisher-repository-id "${PUBLISHER_REPOSITORY_ID}" \
            --provider-control-tag "${GITHUB_REF_NAME}" \
            --provider-control-sha "${PROVIDER_CONTROL_SHA}"
      - name: Create a digest-bound same-run handoff
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
        run: >-
          python3 -I -S run_publisher_tool.py submission prepare
          --directory submission --package "release-assets/${PACKAGE_NAME}"
          --package-sha256 "${PACKAGE_SHA256}"
          --publisher-script publisher/publish.ps1
          --run-id "${GITHUB_RUN_ID}" --run-attempt "${GITHUB_RUN_ATTEMPT}"
      - name: Upload the verified same-run package handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chocolatey-submission
          path: submission/
          if-no-files-found: error
          retention-days: 1
      - name: Emit a complete public approval summary
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package_name }}
          PACKAGE_SHA256: ${{ steps.package.outputs.package_sha256 }}
        run: |
          {
            echo '## Approved Chocolatey submission'
            echo
            echo "- Source: ${{ steps.input.outputs.source_tag }} at ${{ steps.input.outputs.source_commit_sha }}"
            echo "- Source workflow: ${{ inputs.source_workflow_run_id }} at ${{ inputs.source_workflow_head_sha }}"
            echo "- Provider control: ${GITHUB_REF_NAME} at ${{ inputs.provider_control_sha }}"
            echo "- Immutable release ID: ${{ inputs.github_release_id }}"
            echo "- Release manifest SHA-256: ${{ inputs.release_manifest_sha256 }}"
            echo "- Package: ${PACKAGE_NAME}"
            echo "- Package SHA-256: ${PACKAGE_SHA256}"
            echo "- Request: ${{ inputs.request_uuid }}"
          } >> "${GITHUB_STEP_SUMMARY}"

  claim:
    name: claim the exact submission identity without credentials
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      issue_number: ${{ steps.claim.outputs.issue_number }}
      already_submitted: ${{ steps.claim.outputs.already_submitted }}
    steps:
      - name: Checkout immutable claim state tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create, skip, or fail closed on the submission claim
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
        run: >-
          python3 -I -S run_publisher_tool.py submission claim
          --package-name "${PACKAGE_NAME}" --package-sha256 "${PACKAGE_SHA256}"

  publish:
    name: push the exact package with the isolated API key
    if: ${{ needs.claim.outputs.already_submitted != 'true' }}
    needs: [verify, claim]
    runs-on: windows-2025
    timeout-minutes: 10
    environment: chocolatey-publish
    permissions:
      contents: read
    steps:
      - name: Download only this run's verified package handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: chocolatey-submission
          path: submission
      - name: Verify handoff and push as the final credential-bearing step
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          EXPECTED_PACKAGE: ${{ needs.verify.outputs.package_name }}
          EXPECTED_SHA256: ${{ needs.verify.outputs.package_sha256 }}
        shell: pwsh
        run: >-
          & ./submission/publish.ps1
          -SubmissionDirectory submission
          -ExpectedPackage $env:EXPECTED_PACKAGE
          -ExpectedSha256 $env:EXPECTED_SHA256
          -RunId $env:GITHUB_RUN_ID
          -RunAttempt $env:GITHUB_RUN_ATTEMPT

  record:
    name: record an exact completed submission without credentials
    if: >-
      always() && needs.verify.result == 'success' && needs.claim.result == 'success' &&
      (needs.claim.outputs.already_submitted == 'true' || needs.publish.result == 'success')
    needs: [verify, claim, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout immutable claim state tooling
        if: ${{ needs.claim.outputs.already_submitted != 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Mark a newly pushed package as submitted
        if: ${{ needs.claim.outputs.already_submitted != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.claim.outputs.issue_number }}
          PACKAGE_NAME: ${{ needs.verify.outputs.package_name }}
          PACKAGE_SHA256: ${{ needs.verify.outputs.package_sha256 }}
        run: >-
          python3 -I -S run_publisher_tool.py submission record
          --issue-number "${ISSUE_NUMBER}" --package-name "${PACKAGE_NAME}"
          --package-sha256 "${PACKAGE_SHA256}"
      - name: Report an identical prior submission
        if: ${{ needs.claim.outputs.already_submitted == 'true' }}
        run: echo 'The exact package was already recorded as submitted.'
